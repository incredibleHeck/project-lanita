# =============================================================================
# HeckTeck SMS - CI/CD Deployment Pipeline
# =============================================================================
# This workflow automatically deploys the application to your VPS when you
# push to the main branch.
#
# GITHUB SECRETS SETUP (Required):
# Go to your GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#
# 1. VPS_HOST     - Your VPS IP address or domain (e.g., 192.168.1.100)
# 2. VPS_USER     - SSH username (usually 'root' or 'ubuntu')
# 3. VPS_SSH_KEY  - Your private SSH key (the content of ~/.ssh/id_rsa or id_ed25519)
#                   Generate with: ssh-keygen -t ed25519 -C "github-actions"
#                   Add public key to VPS: ~/.ssh/authorized_keys
#
# Optional: VPS_PROJECT_PATH - Repo variable (Settings → Variables). Default: /var/www/project-lanita
#
# VPS .env (set on server, not via GitHub Secrets):
# The deploy workflow does not inject env vars. Create .env on the VPS using
# .env.production.example. Required: JWT_ACCESS_SECRET, JWT_REFRESH_SECRET,
# POSTGRES_PASSWORD, API_URL, CORS_ORIGIN, WEB_PORT=4000,
# NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY (for live payments)
#
# Rollback: see docs/DEPLOY-ROLLBACK.md
# =============================================================================

name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "Starting deployment..."
            cd ${{ vars.VPS_PROJECT_PATH || '/var/www/project-lanita' }} || { echo "Project directory not found"; exit 1; }

            echo "Pulling latest code..."
            git pull origin main
            IMAGE_TAG=$(git rev-parse --short HEAD)
            export IMAGE_TAG
            echo "IMAGE_TAG=$IMAGE_TAG"

            echo "Setting up swap space..."
            sudo fallocate -l 2G /swapfile || true
            sudo chmod 600 /swapfile || true
            sudo mkswap /swapfile || true
            sudo swapon /swapfile || true
            free -h

            echo "Stopping app containers (keep db)..."
            docker compose -f docker-compose.yml stop server client ml-service || true

            echo "Starting database..."
            docker compose -f docker-compose.yml up -d db
            echo "Waiting for database..."
            sleep 10

            echo "Running database migrations before app start..."
            docker compose -f docker-compose.yml run --rm \
              -e IMAGE_TAG="$IMAGE_TAG" \
              server npx prisma migrate deploy

            echo "Rebuilding and starting containers (tagged $IMAGE_TAG)..."
            IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.yml up -d --build

            echo "Smoke check /health..."
            for i in 1 2 3 4 5; do
              if docker compose -f docker-compose.yml exec -T server wget -q --spider http://localhost:3000/health; then
                echo "Health check OK"
                break
              fi
              sleep 5
              if [ "$i" = "5" ]; then
                echo "Health check failed after deploy — see docs/DEPLOY-ROLLBACK.md"
                exit 1
              fi
            done

            echo "Pruning unused images (keeps tagged release images briefly)..."
            docker image prune -f || true

            echo "Deployment complete:"
            docker ps
